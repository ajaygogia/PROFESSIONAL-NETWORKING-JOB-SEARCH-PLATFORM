spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      routes:

        # Auth routes - NO JWT validation required
        - id: user-service-auth
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**

        # User Service routes - JWT Required
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/users/**
          filters:
            - name: JwtAuthFilter

        # Post Service routes - JWT validation required
        - id: post-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/posts/**
          filters:
            - name: JwtAuthFilter

        # Feed Service routes - JWT validation required
        - id: feed-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/feed/**
          filters:
            - name: JwtAuthFilter

        # Search Service routes - JWT validation required
        - id: search-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/search/**
          filters:
            - name: JwtAuthFilter


server:
  port: 8080

jwt:
  secret-key: YOUR_SECRET_KEY

management:
  endpoints:
    web:
      exposure:
        include: health,info
